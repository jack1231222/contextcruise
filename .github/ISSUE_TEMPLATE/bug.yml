name: Bug report
description: Report a reproducible problem without private records.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach conversations, databases, auth.json, credentials, or personal paths."
  - type: input
    id: versions
    attributes:
      label: App build, Codex version, macOS version, and chip
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
